# SPDX-License-Identifier: LGPL-2.1-or-later
# SPDX-FileNotice: Part of the DFM addon.
#
# Where the numbers in the built-in processes come from. Used only by the
# documentation site (docs/build.py); the workbench never reads this file.
#
# sources: one entry per document cited.
#   <id>:                 lowercase-with-dashes, stable: pages link to it
#     publisher:          who published it
#     title:              its title (or a plain description until checked)
#     url:                link, or null until someone finds it
#     archive:            a web.archive.org copy, or null
#     accessed:           YYYY-MM-DD the figures were read, or null
#     note:               optional, one line
#
# values: claims about threshold values, by process file (its name without
# .yaml), material (as in the YAML, including "Default"), rule and field
# (target, limit, binary_severity...).
#   <process>:
#     <material>:
#       <RULE>:
#         <field>: {kind, cite: [source ids], note}
#       <RULE>: {kind, cite, note}     # one claim for every field of the rule
#
# kind is one of:
#   published   the source gives this figure (unit conversion and rounding
#               allowed; say the original in the note)
#   derived     worked out from a source's figures (say how in the note)
#   judgement   engineering judgement, no published figure. cite may name
#               sources that give the advice without a number
#
# A value with no claim is shown on the site as "Not yet sourced". A material
# that inherits a value from Default inherits its claim too.
#
# tests/test_docs.py checks that every claim points at a value that exists and
# every cite at a source here.

