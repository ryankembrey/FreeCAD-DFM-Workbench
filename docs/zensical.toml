# Site configuration for the DFM Workbench documentation (Zensical).
# Build: `pixi run docs` from the repository root. See docs/README.md.
#
# The nav is written by hand, except the blocks between "BEGIN GENERATED" and
# "END GENERATED" markers: docs/build.py rewrites those. Edit around them.

[project]
site_name = "DFM Workbench"
site_description = "Design for manufacturing checks in FreeCAD: how to use the workbench, every rule it checks, and where its numbers come from."
site_url = "https://ryankembrey.github.io/FreeCAD-DFM-Workbench/"
repo_url = "https://github.com/ryankembrey/FreeCAD-DFM-Workbench"
repo_name = "FreeCAD-DFM-Workbench"
copyright = "DFM Workbench by Ryan Kembrey, LGPL-2.1-or-later. This site is generated from the latest main branch."
docs_dir = "content"
site_dir = "build/site"
extra_css = ["stylesheets/extra.css"]

