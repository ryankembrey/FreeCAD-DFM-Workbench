            MAX_WALL_THICKNESS_VARIATION:
                target: '10'
                limit: '15'
    PSU:
        category: Amorphous Thermoplastic
        is_active: true
        rule_limits:
            MIN_WALL_THICKNESS:
                target: '0.51'
                limit: '0.3'
            MAX_WALL_THICKNESS:
                target: '4.57'
                limit: '5.5'
    PP:
        category: Semi-Crystalline Thermoplastic
        is_active: true
        rule_limits:
            MIN_DRAFT_ANGLE:
                target: '2.0'
                limit: '1.0'
            MIN_WALL_THICKNESS:
                target: '0.89'
                limit: '0.6'
            MAX_WALL_THICKNESS:
                target: '3.81'
                limit: '4.5'
            MAX_WALL_THICKNESS_VARIATION:
                target: '10'
