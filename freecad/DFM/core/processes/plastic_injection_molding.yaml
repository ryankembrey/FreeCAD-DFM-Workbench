                target: '0.89'
                limit: '0.6'
            MAX_WALL_THICKNESS:
                target: '3.81'
                limit: '4.5'
            MAX_WALL_THICKNESS_VARIATION:
                target: '10'
                limit: '15'
    PS:
        category: Amorphous Thermoplastic
        is_active: true
