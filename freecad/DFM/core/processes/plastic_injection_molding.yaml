            MAX_WALL_THICKNESS:
                target: '3.81'
                limit: '4.5'
            # Makrolon PC: 4% (Covestro, Snap-Fit Joints for Plastics, Table 2).
            MAX_SNAP_FIT_STRAIN:
                target: '2.4'
                limit: '4.0'
    PET / PBT:
        category: Semi-Crystalline Thermoplastic
        is_active: true
        rule_limits:
            MIN_WALL_THICKNESS:
                target: '0.64'
                limit: '0.4'
