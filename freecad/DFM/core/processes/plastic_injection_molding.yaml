                target: '1.5'
                limit: '0.5'
            MIN_WALL_THICKNESS:
                target: '0.76'
                limit: '0.5'
            MAX_WALL_THICKNESS:
                target: '5.08'
                limit: '6.0'
            MAX_WALL_THICKNESS_VARIATION:
                target: '10'
                limit: '15'
    PSU:
